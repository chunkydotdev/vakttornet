<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gruvkungen: king under the mountain — granite bulk in a miner's
       leather apron, crown of crossed pickaxes, gem eyes glittering in the
       dark. Boss: renders up to 2x tile, fills ~60u -->
  <ellipse cx="32" cy="60" rx="18" ry="3.5" fill="rgba(0,0,0,0.2)"/>
  <!-- stone boots -->
  <g fill="#4a4d44">
    <rect x="19" y="54" width="12" height="6" rx="2.5"/>
    <rect x="33" y="54" width="12" height="6" rx="2.5"/>
  </g>
  <!-- massive granite body -->
  <path d="M13 32 Q10 50 14 57 L50 57 Q54 50 51 32 Q44 24 32 24 Q20 24 13 32 Z" fill="#6b6f66"/>
  <path d="M17 34 Q14 46 16 55" fill="none" stroke="#7d8175" stroke-width="3.5" stroke-linecap="round"/>
  <!-- miner's leather apron -->
  <path d="M24 34 Q24 30 32 30 Q40 30 40 34 L41 55 L23 55 Z" fill="#7a5c39"/>
  <path d="M27 36 Q26 45 27 53" fill="none" stroke="#8d6e48" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ore veins glittering through the hide -->
  <g fill="none" stroke="#d9a441" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M16 38 L19 43 L17 48"/>
    <path d="M48 36 L45 42 L47 47"/>
  </g>
  <!-- arms: one fist, one gripping a haft -->
  <path d="M15 32 Q7 36 7 44 M49 32 Q56 35 57 42" fill="none" stroke="#6b6f66" stroke-width="7" stroke-linecap="round"/>
  <!-- the great pick over the shoulder -->
  <path d="M54 22 L57 44" stroke="#5a4630" stroke-width="3" stroke-linecap="round"/>
  <path d="M47 22 Q54 16 61 22 Q58 19 54 19 Q50 19 47 22 Z" fill="#8e9389"/>
  <path d="M47 22 Q54 25 61 22" fill="none" stroke="#565a50" stroke-width="2"/>
  <!-- quartz-grey beard -->
  <path d="M20 22 Q19 33 32 36 Q45 33 44 22 Q39 17 32 17 Q25 17 20 22 Z" fill="#b9b3a7"/>
  <path d="M24 24 Q26 30 32 32" fill="none" stroke="#cfc9bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- craggy face -->
  <ellipse cx="32" cy="16" rx="10" ry="7.5" fill="#969a8c"/>
  <circle cx="32" cy="21" r="2.6" fill="#7d8175"/>
  <!-- heavy brow -->
  <path d="M23 12 L30 14 M41 12 L34 14" stroke="#4f5349" stroke-width="2.4" stroke-linecap="round"/>
  <!-- GEM EYES, cut and cold -->
  <path d="M25 15 l2.4 -2 l2.4 2 l-2.4 2.6 Z" fill="#3e8a6e"/>
  <path d="M34.2 15 l2.4 -2 l2.4 2 l-2.4 2.6 Z" fill="#a3402f"/>
  <circle cx="27" cy="14.4" r="0.7" fill="#e8f4ec"/>
  <circle cx="36.2" cy="14.4" r="0.7" fill="#f4d9d2"/>
  <!-- crown of crossed pickaxes -->
  <path d="M22 9 Q32 4 42 9" fill="none" stroke="#d9a441" stroke-width="3.5" stroke-linecap="round"/>
  <g stroke="#5a4630" stroke-width="2" stroke-linecap="round">
    <path d="M25 8 L23 1"/>
    <path d="M32 6.5 L32 0"/>
    <path d="M39 8 L41 1"/>
  </g>
  <g fill="#8e9389">
    <path d="M20 2.5 Q23 0 26 2.5 Q23 1.6 20 2.5 Z"/>
    <path d="M29 1.5 Q32 -1 35 1.5 Q32 0.6 29 1.5 Z"/>
    <path d="M38 2.5 Q41 0 44 2.5 Q41 1.6 38 2.5 Z"/>
  </g>
  <circle cx="32" cy="9.2" r="1.4" fill="#a3402f"/>
</svg>
