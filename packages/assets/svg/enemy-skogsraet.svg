<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- skogsrået: the forest's own longing — beautiful from the front, bark
       gown, crown of leaves; but the back is a hollow rotten trunk and the
       fox tail gives her away. Final boss: renders up to 2x, fills ~60u -->
  <ellipse cx="32" cy="60" rx="15" ry="3" fill="rgba(0,0,0,0.16)"/>
  <!-- THE FOX TAIL, swinging out from under the hem -->
  <path d="M40 50 Q52 52 56 44 Q58 39 54 36 Q54 42 48 45 Q43 47 40 50 Z" fill="#b05c33"/>
  <path d="M54 36 Q57 38 56 42 Q59 39 57 35 Z" fill="#e8e4d2"/>
  <!-- long bark-brown gown -->
  <path d="M21 26 Q18 44 19 57 L45 57 Q46 44 43 26 Q38 20 32 20 Q26 20 21 26 Z" fill="#6e5a40"/>
  <path d="M24 30 Q21 44 22 55" fill="none" stroke="#82704f" stroke-width="3" stroke-linecap="round"/>
  <!-- THE HOLLOW BACK: rotten trunk gaping at her left side -->
  <path d="M40 28 Q45 36 44 48 Q40 52 38 48 Q41 40 38 30 Z" fill="#2e2418"/>
  <path d="M39 32 Q42 38 41 46" fill="none" stroke="#473828" stroke-width="2" stroke-linecap="round"/>
  <!-- bracket fungus on the trunk lip -->
  <path d="M43 38 q4 -1 4 2 q-3 2 -4 0 Z" fill="#a08652"/>
  <!-- vine winding up the gown -->
  <path d="M27 54 Q31 46 28 38 Q26 32 30 28" fill="none" stroke="#5a6a48" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="28" cy="44" r="1.4" fill="#8a9a6e"/>
  <!-- graceful arms -->
  <path d="M23 28 Q16 32 15 39 M41 26 Q47 28 49 34" fill="none" stroke="#cfa57e" stroke-width="4" stroke-linecap="round"/>
  <!-- moss-green hair falling past the waist -->
  <g fill="none" stroke="#5f7a52" stroke-width="4.5" stroke-linecap="round">
    <path d="M23 10 Q15 18 17 34 Q17 42 14 47"/>
    <path d="M41 10 Q48 16 47 28"/>
    <path d="M20 14 Q17 24 19 38"/>
  </g>
  <!-- lovely face -->
  <ellipse cx="32" cy="13" rx="8" ry="7.5" fill="#cfa57e"/>
  <!-- warm deep eyes, lashes -->
  <circle cx="28.5" cy="13" r="2.7" fill="#ffffff"/>
  <circle cx="35.5" cy="13" r="2.7" fill="#ffffff"/>
  <circle cx="28.8" cy="13.6" r="1.4" fill="#3d2f1c"/>
  <circle cx="35.2" cy="13.6" r="1.4" fill="#3d2f1c"/>
  <path d="M25.5 10 Q28 8.8 30.5 10 M33.5 10 Q36 8.8 38.5 10" fill="none" stroke="#6e5a40" stroke-width="1.4" stroke-linecap="round"/>
  <!-- knowing half-smile -->
  <path d="M29.5 17.5 Q32 19.3 34.5 17.5" fill="none" stroke="#a3674a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- hairline -->
  <path d="M24 10 Q26 5 32 5 Q38 5 40 10 Q36 7 32 7.5 Q28 7 24 10 Z" fill="#5f7a52"/>
  <!-- CROWN OF LEAVES with one lingonberry -->
  <g fill="#8a9a6e">
    <path d="M24 6 Q23 2 27 2 Q27 5 24 6 Z"/>
    <path d="M31 4 Q31 0 35 1 Q34 4 31 4 Z"/>
    <path d="M38 6 Q40 2 42 4 Q41 7 38 6 Z"/>
  </g>
  <circle cx="29" cy="3.5" r="1.3" fill="#a3402f"/>
  <!-- a linnea flower in her hand -->
  <circle cx="49" cy="34.5" r="1.6" fill="#e8d2dc"/>
  <circle cx="49" cy="34.5" r="0.7" fill="#d9a441"/>
</svg>
