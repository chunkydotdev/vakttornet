<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- vättekungen: the grumpy vätte king — fur-lined cloak, stolen golden
       crown, gnarled scepter. Boss: renders up to 2x tile, fills ~60u -->
  <ellipse cx="32" cy="60" rx="17" ry="3.5" fill="rgba(0,0,0,0.2)"/>
  <g fill="#3f3327">
    <rect x="20" y="54" width="11" height="6" rx="2.5"/>
    <rect x="33" y="54" width="11" height="6" rx="2.5"/>
  </g>
  <!-- gnarled scepter, gold knob -->
  <path d="M52 26 L55 52" stroke="#5a4630" stroke-width="3" stroke-linecap="round"/>
  <circle cx="51.5" cy="23.5" r="4" fill="#d9a441"/>
  <circle cx="50.4" cy="22.4" r="1.3" fill="#f2d98c"/>
  <!-- royal cloak with fur hem -->
  <path d="M16 30 Q12 48 14 56 L50 56 Q52 48 48 30 Q40 24 32 24 Q24 24 16 30 Z" fill="#7e3326"/>
  <path d="M18 32 Q15 46 16 54" fill="none" stroke="#94473a" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 55 Q23 52 32 55 Q41 52 50 55" fill="none" stroke="#b9b3a7" stroke-width="4" stroke-linecap="round"/>
  <!-- tunic front with gold buttons -->
  <path d="M24 34 Q24 28 32 28 Q40 28 40 34 L40 54 L24 54 Z" fill="#5f6b52"/>
  <path d="M32 34 L32 53" stroke="#4c5742" stroke-width="2"/>
  <circle cx="32" cy="40" r="1.4" fill="#d9a441"/>
  <circle cx="32" cy="46" r="1.4" fill="#d9a441"/>
  <!-- arms -->
  <path d="M22 32 Q14 36 13 44 M42 32 Q49 34 51 40" fill="none" stroke="#5f6b52" stroke-width="5" stroke-linecap="round"/>
  <!-- great grey beard -->
  <path d="M20 22 Q19 34 32 38 Q45 34 44 22 Q39 17 32 17 Q25 17 20 22 Z" fill="#b9b3a7"/>
  <path d="M24 25 Q26 31 32 33" fill="none" stroke="#cfc9bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- face -->
  <ellipse cx="32" cy="17" rx="10" ry="7.5" fill="#cfa57e"/>
  <circle cx="32" cy="22" r="2.8" fill="#c08a60"/>
  <circle cx="27" cy="16" r="3" fill="#ffffff"/>
  <circle cx="37" cy="16" r="3" fill="#ffffff"/>
  <circle cx="27.8" cy="16.6" r="1.5" fill="#2a2118"/>
  <circle cx="36.2" cy="16.6" r="1.5" fill="#2a2118"/>
  <!-- kingly scowl -->
  <path d="M23 12.5 L30 14.5 M41 12.5 L34 14.5" stroke="#4b3a2a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the stolen golden crown -->
  <path d="M21 11 L22 3 L26.5 8 L32 1.5 L37.5 8 L42 3 L43 11 Q37 8.6 32 8.6 Q27 8.6 21 11 Z" fill="#d9a441"/>
  <path d="M21 11 Q32 7.6 43 11" fill="none" stroke="#b07f2c" stroke-width="1.6"/>
  <circle cx="32" cy="5.5" r="1.4" fill="#a3402f"/>
  <circle cx="24" cy="7" r="1.1" fill="#3e5a8a"/>
  <circle cx="40" cy="7" r="1.1" fill="#3e5a8a"/>
</svg>
