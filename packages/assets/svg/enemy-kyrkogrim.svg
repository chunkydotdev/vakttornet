<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- kyrkogrim: the buried churchyard guardian — hooded grave-grey wraith,
       lich-gate bell in hand, moss creeping up the hem. Shrugs off
       sunlight's petrify (slowResist) (~50u) -->
  <ellipse cx="32" cy="58" rx="13" ry="3" fill="rgba(0,0,0,0.16)"/>
  <!-- ragged grave-shroud body -->
  <path d="M19 26 Q17 10 32 8 Q47 10 45 26 L47 46 Q48 54 43 52 Q40 58 35 53 Q32 57 29 53 Q24 58 21 52 Q16 54 17 46 Z" fill="#7d8489"/>
  <path d="M22 30 Q21 15 32 12" fill="none" stroke="#99a0a4" stroke-width="4" stroke-linecap="round"/>
  <!-- moss creeping up the hem -->
  <path d="M19 48 Q23 44 26 49 Q29 45 33 50 Q37 46 41 50 Q44 47 46 50 L45 53 Q32 50 20 53 Z" fill="#5a6a48" opacity="0.85"/>
  <!-- deep hood -->
  <path d="M20 22 Q19 9 32 7 Q45 9 44 22 Q40 16 32 16 Q24 16 20 22 Z" fill="#5d6468"/>
  <!-- hollow face inside the hood -->
  <path d="M24 22 Q24 14 32 14 Q40 14 40 22 Q40 28 32 28 Q24 28 24 22 Z" fill="#3a3f44"/>
  <!-- pale unblinking eyes -->
  <circle cx="28.5" cy="21" r="2.4" fill="#cfd8d2"/>
  <circle cx="35.5" cy="21" r="2.4" fill="#cfd8d2"/>
  <circle cx="28.5" cy="21" r="1" fill="#6f7d72"/>
  <circle cx="35.5" cy="21" r="1" fill="#6f7d72"/>
  <!-- arm holding the lich-gate bell -->
  <path d="M43 30 Q50 33 51 39" fill="none" stroke="#7d8489" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M47 41 Q47 37 51 37 Q55 37 55 41 L56 45 L46 45 Z" fill="#6b6354"/>
  <path d="M46 45 L56 45" stroke="#54483d" stroke-width="1.6"/>
  <circle cx="51" cy="47" r="1.4" fill="#d9a441"/>
  <!-- other arm folded -->
  <path d="M21 30 Q15 34 16 40" fill="none" stroke="#7d8489" stroke-width="4.5" stroke-linecap="round"/>
  <!-- small iron cross at the breast -->
  <path d="M32 32 l0 7 M29 34.5 l6 0" stroke="#4a4f54" stroke-width="2.2" stroke-linecap="round"/>
</svg>
