<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- trollyngel: a pebble that got legs — round little troll-spawn, one
       moss tuft, eyes far too big for it. Drawn small (~34u, scale 0.7) -->
  <ellipse cx="32" cy="53" rx="9" ry="2.5" fill="rgba(0,0,0,0.16)"/>
  <!-- stubby feet -->
  <g fill="#6b6f66">
    <ellipse cx="27" cy="51" rx="4" ry="2.8"/>
    <ellipse cx="37" cy="51" rx="4" ry="2.8"/>
  </g>
  <!-- round pebble body -->
  <path d="M20 38 Q19 22 32 20 Q45 22 44 38 Q44 50 32 50 Q20 50 20 38 Z" fill="#7d8175"/>
  <path d="M23 37 Q23 26 31 23" fill="none" stroke="#969a8c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- one proud moss tuft -->
  <path d="M28 21 Q29 16 33 17 Q36 14 37 19 Q34 18 32 20 Q30 19 28 21 Z" fill="#5a6a48"/>
  <!-- tiny arms -->
  <path d="M21 36 Q17 38 16 42 M43 36 Q47 38 48 42" fill="none" stroke="#6b6f66" stroke-width="3.5" stroke-linecap="round"/>
  <!-- a hairline crack of its own -->
  <path d="M32 42 L31 47" fill="none" stroke="#4f5349" stroke-width="1.6" stroke-linecap="round"/>
  <!-- enormous eyes -->
  <circle cx="27.5" cy="32" r="4.2" fill="#ffffff"/>
  <circle cx="36.5" cy="32" r="4.2" fill="#ffffff"/>
  <circle cx="28" cy="33" r="2.1" fill="#2c2f28"/>
  <circle cx="36" cy="33" r="2.1" fill="#2c2f28"/>
  <circle cx="28.8" cy="32.2" r="0.7" fill="#ffffff"/>
  <circle cx="36.8" cy="32.2" r="0.7" fill="#ffffff"/>
  <!-- little nose and worried mouth -->
  <ellipse cx="32" cy="38" rx="2.2" ry="1.8" fill="#969a8c"/>
  <path d="M29.5 43 Q32 41.5 34.5 43" fill="none" stroke="#4f5349" stroke-width="1.6" stroke-linecap="round"/>
</svg>
