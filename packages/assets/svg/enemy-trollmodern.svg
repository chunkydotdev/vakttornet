<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- trollmodern: ancient hunched troll-mother, moss-grown, a young birch
       rooted in her back. Boss: renders up to 2x tile, fills ~62u -->
  <ellipse cx="32" cy="60" rx="26" ry="4" fill="rgba(0,0,0,0.22)"/>
  <!-- birch growing from her back (trunk disappears into the moss) -->
  <path d="M14 32 Q13 16 16 6" fill="none" stroke="#e8e4d2" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M14.5 19 l3.5 0.5 M13.8 13 l-3.4 1 M15.2 9 l3 -0.6" stroke="#5a5a52" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="#7ea05c">
    <ellipse cx="20" cy="6" rx="5" ry="3.6"/>
    <ellipse cx="12" cy="9" rx="4" ry="3"/>
    <ellipse cx="17" cy="12" rx="3.4" ry="2.6"/>
  </g>
  <!-- legs -->
  <g stroke="#525e41" stroke-width="8" stroke-linecap="round">
    <path d="M18 48 L14 58"/>
    <path d="M46 48 L50 58"/>
  </g>
  <!-- arms: knuckles dragging the ground -->
  <g stroke="#5d6a4a" stroke-width="9" stroke-linecap="round">
    <path d="M12 36 L6 52"/>
    <path d="M52 36 L58 52"/>
  </g>
  <!-- hunched massive body -->
  <path d="M8 42 Q6 14 32 10 Q58 14 56 44 Q56 60 32 60 Q8 60 8 42 Z" fill="#6e7c58"/>
  <path d="M13 40 Q12 20 28 13" fill="none" stroke="#8a9a6e" stroke-width="5" stroke-linecap="round"/>
  <!-- old moss patches -->
  <g fill="#46683d">
    <ellipse cx="44" cy="16" rx="7" ry="4"/>
    <ellipse cx="52" cy="30" rx="4.5" ry="6"/>
    <ellipse cx="22" cy="55" rx="6" ry="3"/>
  </g>
  <!-- belly -->
  <ellipse cx="32" cy="50" rx="14" ry="8.5" fill="#8a9a6e"/>
  <!-- heavy ancient brow, small tired eyes -->
  <path d="M16 26 Q24 21 30 25 M48 26 Q40 21 34 25" fill="none" stroke="#54643f" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="24" cy="29" r="3.2" fill="#ffffff"/>
  <circle cx="40" cy="29" r="3.2" fill="#ffffff"/>
  <circle cx="24.8" cy="29.8" r="1.6" fill="#1f2a1a"/>
  <circle cx="39.2" cy="29.8" r="1.6" fill="#1f2a1a"/>
  <!-- great nose -->
  <path d="M26 28 Q27 39 32 42 Q37 39 38 28 Q35 25 32 25 Q29 25 26 28 Z" fill="#97a274"/>
  <ellipse cx="32" cy="39" rx="5" ry="3.4" fill="#828d62"/>
  <!-- mouth and worn-down tusks -->
  <path d="M25 47 Q32 45 39 47" fill="none" stroke="#4d5a3c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 47 l0 -3.5 M38 47 l0 -3.5" stroke="#e8e4d2" stroke-width="3" stroke-linecap="round"/>
  <!-- wisps of grey hair -->
  <path d="M40 10 Q46 4 52 8 M36 9 Q40 3 46 4" fill="none" stroke="#9aa48a" stroke-width="2.2" stroke-linecap="round"/>
</svg>
