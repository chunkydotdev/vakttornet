<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- skattkista: chest thrown open, trollsilver glowing — start every run richer (~54u) -->
  <!-- glow over the hoard -->
  <circle cx="32" cy="24" r="15" fill="#ffd96b" opacity="0.2"/>
  <g stroke="#ffd96b" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
    <line x1="32" y1="9" x2="32" y2="3"/>
    <line x1="18" y1="13" x2="14" y2="8"/>
    <line x1="46" y1="13" x2="50" y2="8"/>
  </g>
  <!-- lid thrown open behind -->
  <path d="M12 26 Q12 12 32 12 Q52 12 52 26 Z" fill="#5b4632"/>
  <path d="M16 25 Q16 15 32 15 Q48 15 48 25 Z" fill="#73583f"/>
  <path d="M29 25 L29 12.6 Q32 12.2 35 12.6 L35 25 Z" fill="#8d8576"/>
  <!-- coins heaped over the rim -->
  <path d="M13 31 Q19 21 27 25 Q32 19 37 25 Q45 21 51 31 Z" fill="#d9a521"/>
  <circle cx="20" cy="26" r="3.2" fill="#f2c14e"/>
  <circle cx="32" cy="23" r="3.4" fill="#f2c14e"/>
  <circle cx="43" cy="26" r="3.2" fill="#f2c14e"/>
  <circle cx="26" cy="28.5" r="3" fill="#f2c14e"/>
  <circle cx="38" cy="28.5" r="3" fill="#f2c14e"/>
  <path d="M19 25 a3.2 3.2 0 0 1 2 -2 M31 22 a3.4 3.4 0 0 1 2 -2 M42 25 a3.2 3.2 0 0 1 2 -2" fill="none" stroke="#ffe49a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- chest body -->
  <path d="M12 30 L52 30 L52 52 Q52 55 49 55 L15 55 Q12 55 12 52 Z" fill="#7a5a36"/>
  <path d="M12 30 L52 30 L52 34 L12 34 Z" fill="#8f6b40"/>
  <g stroke="#5b4632" stroke-width="1.8" stroke-linecap="round">
    <line x1="14" y1="41" x2="50" y2="41"/>
    <line x1="14" y1="48" x2="50" y2="48"/>
  </g>
  <!-- iron band + golden hasp -->
  <rect x="29" y="30" width="6" height="25" fill="#8d8576"/>
  <rect x="28" y="33" width="8" height="9" rx="1.5" fill="#d9a521"/>
  <circle cx="32" cy="36" r="1.6" fill="#7d6238"/>
  <path d="M30.9 40.5 L32 36.8 L33.1 40.5 Z" fill="#7d6238"/>
  <!-- strays that missed the chest -->
  <circle cx="8" cy="55" r="2.4" fill="#d9a441"/>
  <circle cx="8" cy="55" r="1" fill="#f2d98c"/>
  <circle cx="56.5" cy="55" r="2.4" fill="#d9a441"/>
  <circle cx="56.5" cy="55" r="1" fill="#f2d98c"/>
</svg>
