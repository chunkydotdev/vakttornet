<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- skuggvarg: lean shadow-wolf mid-lope, smoke wisps trailing off its
       back, ember eyes glowing through the dusk (~52u wide) -->
  <ellipse cx="33" cy="56" rx="19" ry="3" fill="rgba(0,0,0,0.18)"/>
  <!-- shadow-wisps streaming behind -->
  <g fill="none" stroke="#3a3f4d" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M10 34 Q4 32 6 26"/>
    <path d="M12 40 Q6 41 6 35"/>
  </g>
  <!-- legs, stretched in the lope -->
  <g stroke="#2e3340" stroke-width="5" stroke-linecap="round">
    <path d="M18 43 L13 53"/>
    <path d="M25 45 L24 54"/>
    <path d="M42 44 L47 53"/>
    <path d="M48 41 L55 49"/>
  </g>
  <!-- long low body -->
  <path d="M10 38 Q12 28 24 27 Q36 26 46 29 L52 32 Q54 40 46 42 Q34 46 22 44 Q12 43 10 38 Z" fill="#3a3f4d"/>
  <path d="M15 36 Q17 30 25 29" fill="none" stroke="#4c5363" stroke-width="4" stroke-linecap="round"/>
  <!-- ragged shoulder fur -->
  <path d="M24 27 Q28 22 34 23 Q31 20 26 22 Z" fill="#2e3340"/>
  <!-- bushy tail -->
  <path d="M11 37 Q3 35 2 43 Q8 44 13 41 Z" fill="#2e3340"/>
  <!-- head: pricked ears, long muzzle -->
  <path d="M45 30 L43 19 L49 24 L52 17 L56 25 Q61 27 60 32 Q58 37 51 36 Q46 35 45 30 Z" fill="#3a3f4d"/>
  <path d="M55 31 Q59 31 60 32" fill="none" stroke="#2e3340" stroke-width="2" stroke-linecap="round"/>
  <!-- nose -->
  <circle cx="60" cy="31" r="1.6" fill="#1d212b"/>
  <!-- ember eye, glowing -->
  <circle cx="52" cy="27.5" r="2.6" fill="#e8a23f"/>
  <circle cx="52.6" cy="27" r="1" fill="#f7d98a"/>
  <!-- bared teeth -->
  <path d="M55 34 l1.5 2 M58 33.4 l1.2 2" stroke="#e8e4d2" stroke-width="1.6" stroke-linecap="round"/>
</svg>
